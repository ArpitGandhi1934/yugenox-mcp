name: Publish to MCP Registry

# Publishes registry/{instagram,youtube,social}/server.json to registry.modelcontextprotocol.io.
# Trigger: push a tag like v1.0.1. The tag (minus the "v") becomes the version of all three
# entries, because the registry rejects a version that already exists.
# Auth: GitHub Actions OIDC, which grants the io.github.<repo owner>/* namespace. No secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1). Must not exist in the registry yet."
        required: true

permissions:
  id-token: write # OIDC token for mcp-publisher login github-oidc
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help | head -3

      - name: Stamp version into server.json files
        run: |
          for f in registry/*/server.json; do
            jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            echo "$f -> $(jq -r '.name + " " + .version' "$f")"
          done

      - name: Validate
        run: |
          for dir in instagram youtube social; do
            ./mcp-publisher validate "registry/$dir/server.json"
          done

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          for dir in instagram youtube social; do
            echo "::group::$dir"
            ./mcp-publisher publish "registry/$dir/server.json"
            echo "::endgroup::"
          done

      - name: Verify in registry
        run: |
          sleep 5
          curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=yugenox" \
            | jq -r '.servers[] | .server | "\(.name) \(.version)"'
